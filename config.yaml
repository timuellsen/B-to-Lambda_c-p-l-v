General:

    Measurement: B_to_Lcplnu
    POI: Signal
    InputPath: pyhf/test_output.root:{RegionPath}/{SamplePath}/{VariationPath}
    HistogramFolder: pyhf/output/
    VariationPath: Nominal

Samples:

  - Name: Data
    SamplePath: Data
    Data: True

  - Name: Signal
    SamplePath: signMC
    DisableStaterror: False

  - Name: Background
    SamplePath: background
    DisableStaterror: False

  - Name: Continuum
    SamplePath: continuum
    DisableStaterror: False

Regions:

  - Name: Electron
    RegionPath: channel1

  - Name: Muon
    RegionPath: channel2

NormFactors:

  - Name: Signal
    Samples:
      - Signal
    Nominal: 1
    Bounds: [0, 10]

  - Name: Background
    Samples:
      - Background
    Nominal: 1
    Bounds: [0, 10]

  - Name: Continuum
    Samples:
      - Continuum
    Nominal: 1
    Bounds: [0, 10]

